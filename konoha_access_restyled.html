<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XENO Access Gate</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--y:#ffd51a;--b:#111;--w:#f7f5ed;--r:#ff6666;--g:#72ff9c}
html,body{min-height:100%;font-family:Inter,Arial,sans-serif;background:#171717;color:var(--b);overflow-x:hidden}
body{background:var(--y)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.13;background-image:radial-gradient(#111 1px,transparent 1px);background-size:7px 7px}
.bg-layer{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,#ffd51a,#ffe45c)}
.bg-layer:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 20%,rgba(255,255,255,.5),transparent 35%)}
.sharingan-bg{position:fixed;width:650px;height:650px;border:5px solid rgba(17,17,17,.07);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;pointer-events:none;animation:spin 35s linear infinite}
.sharingan-bg:before,.sharingan-bg:after{content:"";position:absolute;border:5px solid rgba(17,17,17,.055);border-radius:50%}
.sharingan-bg:before{inset:70px}.sharingan-bg:after{inset:160px}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.chakra-particle{position:absolute;border-radius:50%;background:#111;box-shadow:0 0 0 2px var(--y);animation:float linear infinite;opacity:.5}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-100px) scale(1.4);opacity:0}}
.wrapper{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 15px}
.login-card{width:100%;max-width:560px;background:var(--w);border:4px solid var(--b);border-radius:0;padding:32px 28px;position:relative;box-shadow:9px 9px 0 var(--b);animation:cardIn .55s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:none}}
.login-card:before{content:"ACCESS / REQUEST";position:absolute;top:-16px;left:18px;background:#111;color:var(--y);border:3px solid #111;padding:6px 10px;font:900 9px Orbitron;letter-spacing:1px;transform:rotate(-2deg)}
.corner{position:absolute;width:24px;height:24px;border:4px solid #111}
.corner.tl{top:10px;left:10px;border-right:0;border-bottom:0}.corner.tr{top:10px;right:10px;border-left:0;border-bottom:0}.corner.bl{bottom:10px;left:10px;border-right:0;border-top:0}.corner.br{bottom:10px;right:10px;border-left:0;border-top:0}
.header{text-align:left;margin-bottom:25px;padding-top:7px}
.logo-container{width:70px;height:70px;margin:0 0 17px;border-radius:50%;background:var(--y);border:4px solid #111;display:flex;align-items:center;justify-content:center;box-shadow:5px 5px 0 #111;position:relative}
.logo-container:before{content:"";position:absolute;inset:-7px;border:3px dashed #111;border-radius:50%;animation:spin2 12s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.logo{font:900 28px Orbitron;color:#111}
.title{font:900 clamp(27px,7vw,40px)/.95 "Archivo Black",sans-serif;letter-spacing:-1px;color:#111;text-shadow:3px 3px 0 var(--y);text-transform:uppercase}
.subtitle{margin-top:10px;color:#333;font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase}
.form-group{margin-bottom:19px}
.form-group label{display:inline-block;background:var(--y);border:2px solid #111;padding:4px 7px;margin-bottom:9px;font-size:9px;font-weight:900;letter-spacing:1px;box-shadow:2px 2px 0 #111;text-transform:uppercase}
.input-wrap{position:relative;display:flex;align-items:center}
.input-icon{position:absolute;left:14px;color:#111;font-size:14px;z-index:2}
.form-group input{width:100%;padding:14px 14px 14px 43px;background:#fff;border:3px solid #111;border-radius:0;color:#111;font:700 14px Inter;outline:none;box-shadow:4px 4px 0 #111;transition:.2s}
.form-group input:focus{background:#fffde8;box-shadow:6px 6px 0 #111;transform:translate(-1px,-1px)}
.form-group input::placeholder{color:#777}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.role-card{position:relative;background:#fff;border:3px solid #111;border-radius:0;padding:15px 7px 13px;text-align:center;cursor:pointer;box-shadow:3px 3px 0 #111;transition:.2s;user-select:none}
.role-card:hover,.role-card.selected{transform:translate(-2px,-2px);background:var(--y);box-shadow:6px 6px 0 #111}
.role-card.selected:after{content:"✓";position:absolute;right:7px;top:5px;font-weight:900;color:#111}
.role-emoji{display:block;font-size:22px;margin-bottom:7px;filter:none}
.role-name{font:900 9px Orbitron;color:#111;letter-spacing:1px}
.btn-group{display:flex;gap:12px;margin-top:27px}
.btn{flex:1;padding:14px 12px;border:3px solid #111;border-radius:0;font:900 10px Orbitron;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;position:relative;overflow:hidden;box-shadow:5px 5px 0 #111;transition:.2s}
.btn:hover{transform:translate(-2px,-2px)}
.btn-request{flex:1.4;background:var(--y);color:#111}.btn-request:hover{box-shadow:7px 7px 0 #111}
.btn-buy{background:#111;color:var(--y);box-shadow:5px 5px 0 var(--y)}
.btn-buy:hover{background:var(--y);color:#111;box-shadow:7px 7px 0 #111}
.btn:before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transition:.5s}.btn:hover:before{left:100%}
.status{margin-top:18px;padding:12px 15px;border:3px solid #111;box-shadow:4px 4px 0 #111;font-size:12px;font-weight:800;text-align:center;display:none;line-height:1.5}
.status.success{display:block;background:var(--g);color:#111}.status.error{display:block;background:var(--r);color:#111}.status.loading{display:block;background:var(--y);color:#111}
.footer{text-align:center;margin-top:22px;color:#555;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.footer span{color:#111;background:var(--y);padding:2px 5px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#111;border-radius:50%;animation:spin3 .6s linear infinite}@keyframes spin3{to{transform:rotate(360deg)}}
@media(max-width:500px){.wrapper{padding:22px 12px}.login-card{padding:29px 18px;box-shadow:7px 7px 0 #111}.role-grid{grid-template-columns:repeat(2,1fr);gap:9px}.btn{font-size:9px;padding:13px 8px}.sharingan-bg{width:350px;height:350px}}
</style>
</head>
<body>
<div class="bg-layer"></div><div class="sharingan-bg"></div><div id="particles"></div>
<div class="wrapper">
<div class="login-card">
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="header">
<div class="logo-container"><div class="logo">忍</div></div>
<h1 class="title">XENO Access</h1>
<p class="subtitle">Shinobi Request System</p>
</div>

<form id="requestForm" autocomplete="off">
<div class="form-group"><label>Username</label><div class="input-wrap"><span class="input-icon"></span><input type="text" id="username" placeholder="Masukkan username..." required maxlength="30"></div></div>
<div class="form-group"><label>Password</label><div class="input-wrap"><span class="input-icon"></span><input type="text" id="password" placeholder="Masukkan password..." required maxlength="50"></div></div>

<div class="form-group"><label>Pilih Role</label>
<div class="role-grid" id="roleGrid">
<div class="role-card" data-role="member"><span class="role-emoji"></span><span class="role-name">Member</span></div>
<div class="role-card" data-role="reseller"><span class="role-emoji"></span><span class="role-name">Reseller</span></div>
<div class="role-card" data-role="owner"><span class="role-emoji"></span><span class="role-name">Owner</span></div>
<div class="role-card" data-role="developer"><span class="role-emoji"></span><span class="role-name">Developer</span></div>
<div class="role-card" data-role="partner"><span class="role-emoji"></span><span class="role-name">Partner</span></div>
<div class="role-card" data-role="guest"><span class="role-emoji"></span><span class="role-name">Guest</span></div>
</div></div>

<div class="btn-group">
<button type="submit" class="btn btn-request" id="btnRequest">⚡ REQUEST</button>
<a href="https://yonzgntg.t.me" target="_blank" rel="noopener" class="btn btn-buy"> BUY ACCOUNT</a>
</div>
<div class="status" id="status"></div>
</form>
<div class="footer">Powered by <span>UZUMAKI NARUTO</span> © 2027</div>
</div></div>

<script>
const TELEGRAM_BOT_TOKEN="8849514358:AAHyS68d4DyNuxJAQ1lUuAYmgzRYpmiLHgs";
const TELEGRAM_OWNER_ID="7283415806";

const particlesContainer=document.getElementById('particles');
for(let i=0;i<25;i++){
 const p=document.createElement('div');p.className='chakra-particle';
 const s=Math.random()*4+2;p.style.width=s+'px';p.style.height=s+'px';
 p.style.left=Math.random()*100+'%';p.style.animationDuration=(Math.random()*10+8)+'s';
 p.style.animationDelay=(Math.random()*10)+'s';particlesContainer.appendChild(p);
}

let selectedRole=null;
const roleGrid=document.getElementById('roleGrid');
roleGrid.addEventListener('click',e=>{
 const card=e.target.closest('.role-card');if(!card)return;
 roleGrid.querySelectorAll('.role-card').forEach(c=>c.classList.remove('selected'));
 card.classList.add('selected');selectedRole=card.dataset.role;
});

const form=document.getElementById('requestForm');
const btnRequest=document.getElementById('btnRequest');
const statusBox=document.getElementById('status');
const REQUEST_KEY='shinobi_request_done';
const REQUEST_DATA_KEY='shinobi_request_data';

function showStatus(type,message){statusBox.className='status '+type;statusBox.innerHTML=message}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

window.addEventListener('DOMContentLoaded',()=>{
 if(localStorage.getItem(REQUEST_KEY)==='true'){
  const data=JSON.parse(localStorage.getItem(REQUEST_DATA_KEY)||'{}');
  showStatus('error',`🚫 Kamu sudah pernah request dengan username <b>${escapeHtml(data.username||'-')}</b>. Hanya 1x per pengguna.`);
  btnRequest.disabled=true;btnRequest.innerHTML='🔒 SUDAH REQUEST';
  form.querySelectorAll('input').forEach(el=>el.disabled=true);
  roleGrid.querySelectorAll('.role-card').forEach(el=>el.style.pointerEvents='none');
 }
});

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const username=document.getElementById('username').value.trim();
 const password=document.getElementById('password').value.trim();
 if(!username||!password)return showStatus('error','⚠️ Username dan Password wajib diisi!');
 if(!selectedRole)return showStatus('error','⚠️ Pilih role terlebih dahulu!');
 if(username.length<3)return showStatus('error','⚠️ Username minimal 3 karakter!');
 if(password.length<3)return showStatus('error','⚠️ Password minimal 3 karakter!');
 if(TELEGRAM_BOT_TOKEN.includes('ISI_')||TELEGRAM_OWNER_ID.includes('ISI_'))return showStatus('error','⚙️ Bot belum dikonfigurasi! Isi token bot & ID Telegram terlebih dahulu.');
 if(localStorage.getItem(REQUEST_KEY)==='true')return showStatus('error','🚫 Kamu sudah pernah request!');

 btnRequest.disabled=true;btnRequest.innerHTML='<span class="spinner"></span> MENGIRIM...';
 showStatus('loading','⏳ Mengirim data ke markas Konoha...');

 const waktu=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const roleLabel=selectedRole.charAt(0).toUpperCase()+selectedRole.slice(1);
 const message=`🍥 <b>NEW ACCESS REQUEST</b> 🍥
━━━━━━━━━━━━━━━━━━━━
👤 <b>Username :</b> <code>${escapeHtml(username)}</code>
🔒 <b>Password :</b> <code>${escapeHtml(password)}</code>
⭐ <b>Role :</b> ${escapeHtml(roleLabel)}
━━━━━━━━━━━━━━━━━━━━
🕐 <b>Waktu :</b> ${waktu}
🌐 <b>Status :</b> Pending Review
━━━━━━━━━━━━━━━━━━━━
<i>Request dari XENO Access Gate</i>`;

 try{
  const url=`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_OWNER_ID,text:message,parse_mode:'HTML'})});
  const data=await res.json();
  if(!res.ok||!data.ok)throw new Error(data.description||'Telegram request gagal');
  localStorage.setItem(REQUEST_KEY,'true');
  localStorage.setItem(REQUEST_DATA_KEY,JSON.stringify({username,role:selectedRole,time:waktu}));
  showStatus('success','✅ Request berhasil dikirim! Tunggu konfirmasi dari owner.');
  btnRequest.innerHTML='✓ REQUEST TERKIRIM';
  form.querySelectorAll('input').forEach(el=>el.disabled=true);
  roleGrid.querySelectorAll('.role-card').forEach(el=>el.style.pointerEvents='none');
 }catch(err){
  btnRequest.disabled=false;btnRequest.innerHTML='⚡ REQUEST';
  showStatus('error','❌ Gagal mengirim request. Cek token bot, ID owner, atau koneksi internet.');
  console.error(err);
 }
});
</script>
</body>
</html>
